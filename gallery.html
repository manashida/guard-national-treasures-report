<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物种图鉴 · 三地生物多样性调研</title>
<style>
:root{
  --paper:#F7F5EF; --green:#2E4A3A; --clay:#B4552F; --moss:#7C8F6B;
  --ink:#26261F; --line:#D6D2C4; --dim:#6E6C60;
  --serif:"SimSun","宋体",Cambria,serif;
  --sans:"Microsoft YaHei","微软雅黑",Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--paper);font-family:var(--sans);color:var(--ink)}
img{display:block;object-fit:cover}

.wrap{height:100%;display:flex;flex-direction:column;padding:20px 32px 0}

/* 头部 */
.head{display:flex;align-items:baseline;gap:18px;border-bottom:2px solid var(--green);padding-bottom:10px;flex:none}
.head h1{font-family:var(--serif);font-size:30px;font-weight:400;color:var(--green);letter-spacing:.02em}
.head .cnt{font-size:15px;color:var(--dim);margin-left:auto}
.head .back{font-size:14px;color:var(--clay);text-decoration:none;border:1px solid var(--line);padding:4px 12px;border-radius:20px;transition:.2s}
.head .back:hover{background:var(--clay);color:#fff;border-color:var(--clay)}

/* 筛选栏 */
.fbar{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex:none;gap:6px}
.fbar .lb{width:46px;font-size:14px;color:var(--clay);letter-spacing:.1em;flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-family:var(--sans);font-size:14px;color:var(--ink);background:transparent;
  border:1px solid var(--line);padding:4px 11px;border-radius:20px;cursor:pointer;transition:.18s;white-space:nowrap}
.chip:hover{border-color:var(--moss)}
.chip.on{background:var(--green);border-color:var(--green);color:var(--paper)}
.chip .c{color:var(--dim);font-size:12px;margin-left:4px}
.chip.on .c{color:#CFD8CC}
#q{font-family:var(--sans);font-size:14px;padding:6px 14px;border:1px solid var(--line);border-radius:20px;
  background:#fff;color:var(--ink);width:280px;outline:none;flex:none}
#q:focus{border-color:var(--moss)}

/* 照片墙 */
.wall{flex:1;overflow-y:auto;padding:14px 4px 16px 0;scrollbar-width:thin}
.wall::-webkit-scrollbar{width:8px}
.wall::-webkit-scrollbar-thumb{background:#CFCBBD;border-radius:4px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px 14px}
.ghead{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;
  padding:10px 0 2px;border-bottom:1px solid var(--line);margin-top:6px}
.ghead .t{font-family:var(--serif);font-size:18px;color:var(--green)}
.ghead .n{font-size:13px;color:var(--dim)}
.card{cursor:pointer;border:1px solid transparent;padding:0;background:transparent;text-align:left;font-family:var(--sans);border-radius:6px}
.card .th{position:relative;width:100%;height:110px;background:#E7E3D7;overflow:hidden;border-radius:5px}
.card .th img{width:100%;height:100%;transition:transform .35s ease}
.card:hover .th img{transform:scale(1.06)}
.card .noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:#9A9788;text-align:center;padding:8px}
.card .nm{font-size:14px;line-height:1.3;padding-top:6px;color:var(--ink);height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .fk{font-size:12px;color:#9A9788;line-height:1.2;height:15px;overflow:hidden;margin-top:2px}
.card.sel .th{outline:2px solid var(--clay);outline-offset:-2px}
.card.sel .nm{color:var(--clay)}
.empty{grid-column:1/-1;padding:60px 0;font-size:18px;color:#9A9788;text-align:center}

/* 底部 */
.foot{display:flex;justify-content:space-between;align-items:center;padding:10px 0 14px;border-top:1px solid var(--line);
  font-size:13px;color:var(--dim);flex:none}
.foot .r{font-variant-numeric:tabular-nums}

/* 灯箱：左图右文 */
.lb{position:fixed;inset:0;background:rgba(12,16,12,.96);z-index:100;display:none;align-items:center;justify-content:center;padding:40px 72px 56px}
.lb.on{display:flex}
.lb-inner{display:flex;width:100%;max-width:1320px;min-width:0;height:100%;max-height:calc(100vh - 96px);
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px;overflow:hidden}
.lb-media{flex:1;min-width:0;min-height:0;overflow:hidden;background:#0A0E0A;display:flex;align-items:center;justify-content:center;padding:18px;position:relative}
.lb-media img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:4px;transition:opacity .18s ease}
.lb-media img.swap{opacity:.35}
.lb-info{width:420px;flex:none;background:#171D17;color:#EDE8DC;padding:34px 30px 40px;overflow-y:auto;scrollbar-width:thin}
.lb-info::-webkit-scrollbar{width:6px}
.lb-info::-webkit-scrollbar-thumb{background:#3A423A;border-radius:3px}
.lb-kicker{font-size:11px;letter-spacing:.2em;color:#9E9885;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lb-idx{flex:none;letter-spacing:.06em;color:#7E7A6A;font-variant-numeric:tabular-nums}
.lb-info h2{font-family:var(--serif);font-size:26px;font-weight:400;color:#F4EFE2;line-height:1.4;margin-bottom:8px}
.lb-latin{font-style:italic;font-size:13px;color:#B9B29E;line-height:1.55;margin-bottom:12px;word-break:break-word}
.lb-meta{font-size:12px;color:#A8A395;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px;line-height:1.6}
.lb-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.lb-tags:empty{display:none}
.lb-tag{font-size:11px;padding:3px 10px;border-radius:20px;background:rgba(180,85,47,.22);
  color:#E9B79C;border:1px solid rgba(180,85,47,.45);white-space:nowrap}
.lb-sec{margin-bottom:18px}
.lb-sec:last-child{margin-bottom:0}
.lb-h{font-size:11px;letter-spacing:.16em;color:#8E8A78;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.lb-h::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.09)}
.lb-info p{font-size:14.5px;line-height:1.95;color:#D8D2C2;text-align:justify;white-space:pre-line;word-break:break-word}
.lb-info p b{color:#E9B79C;font-weight:600}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;
  background:rgba(18,24,18,.72);border:1px solid rgba(255,255,255,.24);color:#F2EDE0;
  display:flex;align-items:center;justify-content:center;font-size:27px;line-height:1;cursor:pointer;
  user-select:none;transition:background .18s,border-color .18s,transform .18s;z-index:3;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding-bottom:2px}
.lb-nav:hover{background:rgba(180,85,47,.92);border-color:rgba(255,255,255,.45);transform:translateY(-50%) scale(1.08)}
.lb-nav:active{transform:translateY(-50%) scale(.94)}
.lb-nav.prev{left:14px}
.lb-nav.next{right:14px}
.lb-nav.off{opacity:.22;pointer-events:none}
.lb .close{position:absolute;top:14px;right:22px;font-size:30px;color:rgba(255,255,255,.55);cursor:pointer;line-height:1;z-index:2}
.lb .close:hover{color:#fff}
.lb .pos{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#8E8A78;font-size:13px;letter-spacing:.06em}

@media(max-width:1000px){
  .lb{padding:16px 12px 44px}
  .lb-inner{flex-direction:column;width:100%;max-width:100%;max-height:calc(100vh - 60px)}
  .lb-media{flex:1;min-height:0;width:100%;padding:10px}
  .lb-media img{max-width:100%;max-height:100%}
  .lb-info{width:100%;height:46%;flex:none;padding:20px 18px 26px}
  .lb-info h2{font-size:21px}
  .lb-info p{font-size:13px;line-height:1.8}
  .lb-nav{width:40px;height:40px;font-size:23px}
  .lb-nav.prev{left:8px}.lb-nav.next{right:8px}
  .lb .pos{display:none}
}

@media(max-width:720px){
  .wrap{padding:12px 14px 0}
  .head h1{font-size:22px}
  .fbar .lb{display:none}
  #q{width:100%;margin-top:6px}
  .fbar:nth-of-type(4){flex-wrap:wrap}
  .wgrid{grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}
  .card .th{height:86px}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="head">
    <h1>物种图鉴</h1>
    <span class="cnt" id="cnt">加载中…</span>
    <a class="back" href="index.html">← 返回汇报</a>
  </div>

  <div class="fbar"><div class="lb">地点</div><div class="chips" id="f-site"></div></div>
  <div class="fbar"><div class="lb">科</div><div class="chips" id="f-fam"></div></div>
  <div class="fbar"><div class="lb">标签</div><div class="chips" id="f-tag"></div>
    <input id="q" type="text" placeholder="搜索 中文名 / 学名 / 别名　（按 / 聚焦）" autocomplete="off"></div>

  <div class="wall" id="wall"><div class="wgrid" id="wgrid"></div></div>

  <div class="foot">
    <div>图鉴按报告条目编排，同一物种的多角度照片合并为一条；汇总数字为去重后的记录数。</div>
    <div class="r" id="pos">第 — / — 张</div>
  </div>
</div>

<div class="lb" id="lb">
  <div class="close" id="lb-close">×</div>
  <div class="lb-inner">
    <div class="lb-media">
      <img id="lb-img" src="" alt="">
      <div class="lb-nav prev" id="lb-prev" title="上一张（←）">‹</div>
      <div class="lb-nav next" id="lb-next" title="下一张（→）">›</div>
    </div>
    <aside class="lb-info" id="lb-info">
      <div class="lb-kicker"><span id="lb-kicker"></span><span class="lb-idx" id="lb-idx"></span></div>
      <h2 id="lb-name"></h2>
      <div class="lb-latin" id="lb-latin"></div>
      <div class="lb-meta" id="lb-meta"></div>
      <div class="lb-tags" id="lb-tags"></div>
      <div class="lb-sec">
        <div class="lb-h">形态与习性</div>
        <p id="lb-desc"></p>
      </div>
      <div class="lb-sec" id="lb-basis-wrap">
        <div class="lb-h">照片可见特征</div>
        <p id="lb-basis"></p>
      </div>
      <div class="lb-sec" id="lb-alias-wrap">
        <div class="lb-h">别名</div>
        <p id="lb-alias"></p>
      </div>
    </aside>
  </div>
  <div class="pos" id="lb-pos"></div>
</div>

<script src="data.js"></script>
<script>
(function(){
  var D = window.DATA, S = D.species;
  var IMG = "images/";
  var st = { f:{site:"", fam:"", tag:"", q:""}, sel:0, lb:{on:false, list:[], i:0} };

  function $(id){ return document.getElementById(id); }

  function match(s){
    if(st.f.site && s.site !== st.f.site) return false;
    if(st.f.fam){
      if(st.f.fam === "__none__"){ if(s.family) return false; }
      else if(s.family !== st.f.fam) return false;
    }
    if(st.f.tag && (s.tags || []).indexOf(st.f.tag) < 0) return false;
    if(st.f.q){
      var q = st.f.q.toLowerCase();
      var hay = [s.name, s.latin, s.alias, s.family].join(" ").toLowerCase();
      if(hay.indexOf(q) < 0) return false;
    }
    return true;
  }

  function buildFilters(){
    // 地点
    var sites = D.meta.sites;
    var html = '<button class="chip' + (!st.f.site ? ' on' : '') + '" data-k="site" data-v="">全部<span class="c">' + S.length + '</span></button>';
    sites.forEach(function(site){
      var n = S.filter(function(s){ return s.site === site; }).length;
      html += '<button class="chip' + (st.f.site === site ? ' on' : '') + '" data-k="site" data-v="' + site + '">' + site + '<span class="c">' + n + '</span></button>';
    });
    $("f-site").innerHTML = html;

    // 科
    var fams = {};
    S.forEach(function(s){ var f = s.family || "__none__"; fams[f] = (fams[f] || 0) + 1; });
    var keys = Object.keys(fams).filter(function(k){ return k !== "__none__"; })
      .sort(function(a,b){ return fams[b] - fams[a] || a.localeCompare(b,"zh"); });
    var h2 = '<button class="chip' + (!st.f.fam ? ' on' : '') + '" data-k="fam" data-v="">全部科<span class="c">' + keys.length + '</span></button>';
    keys.forEach(function(f){
      h2 += '<button class="chip' + (st.f.fam === f ? ' on' : '') + '" data-k="fam" data-v="' + f + '">' + f + '<span class="c">' + fams[f] + '</span></button>';
    });
    if(fams["__none__"]){
      h2 += '<button class="chip' + (st.f.fam === "__none__" ? ' on' : '') + '" data-k="fam" data-v="__none__">科名未标注<span class="c">' + fams["__none__"] + '</span></button>';
    }
    $("f-fam").innerHTML = h2;

    // 标签
    var tags = {};
    S.forEach(function(s){ (s.tags || []).forEach(function(t){ tags[t] = (tags[t] || 0) + 1; }); });
    var h3 = '<button class="chip' + (!st.f.tag ? ' on' : '') + '" data-k="tag" data-v="">全部标签<span class="c">' + Object.keys(tags).length + '</span></button>';
    Object.keys(tags).forEach(function(t){
      h3 += '<button class="chip' + (st.f.tag === t ? ' on' : '') + '" data-k="tag" data-v="' + t + '">' + t + '<span class="c">' + tags[t] + '</span></button>';
    });
    $("f-tag").innerHTML = h3;
  }

  var curVis = [];
  function renderWall(){
    buildFilters();
    curVis = S.filter(match);
    var ORD = {"大兴村":0, "东海岸":1, "望天湖":2};
    curVis.sort(function(a,b){
      if(ORD[a.site] !== ORD[b.site]) return ORD[a.site] - ORD[b.site];
      var fa = a.family || "\uFFFF", fb = b.family || "\uFFFF";
      if(fa !== fb) return fa.localeCompare(fb, "zh");
      return a.idx - b.idx;
    });

    var shots = 0;
    curVis.forEach(function(s){ shots += (s.photos || []).length; });
    var c = curVis.length + " 条 · " + shots + " 张照片";
    if(curVis.length !== S.length) c += "（全部 " + S.length + " 条 / " + D.meta.photos + " 张）";
    $("cnt").textContent = c;

    var html = "", lastSite = "";
    curVis.forEach(function(s, i){
      if(s.site !== lastSite){
        lastSite = s.site;
        var n = 0;
        curVis.forEach(function(x){ if(x.site === s.site) n++; });
        html += '<div class="ghead"><div class="t">' + s.site + '</div><div class="n">' + n + ' 条</div></div>';
      }
      var img = (s.photos && s.photos.length)
        ? '<img src="' + IMG + s.photos[0] + '" alt="' + s.name + '" loading="lazy">'
        : '<div class="noimg">报告未附照片</div>';
      html += '<button class="card" data-i="' + i + '" title="' + s.name + '">' +
        '<div class="th">' + img + '</div>' +
        '<div class="nm">' + s.name.replace(/（[^）]*）/g, "") + '</div>' +
        '<div class="fk">' + (s.family || "科名未标注") +
          ((s.photos && s.photos.length > 1) ? " · " + s.photos.length + " 张" : "") + '</div>' +
        '</button>';
    });
    if(!curVis.length) html = '<div class="empty">没有符合条件的记录——换个筛选组合，或清空搜索关键词。</div>';
    $("wgrid").innerHTML = html;

    if(st.sel >= curVis.length) st.sel = 0;
    paintSel();
  }

  function paintSel(){
    var cards = document.querySelectorAll("#wgrid .card");
    [].forEach.call(cards, function(c){
      c.classList.toggle("sel", +c.dataset.i === st.sel);
    });
    var s = curVis[st.sel];
    if(!s){ $("pos").textContent = "第 — / — 张"; return; }
    $("pos").textContent = "第 " + (st.sel + 1) + " / " + curVis.length + " 条　·　" + s.site + " · " + (s.family || "科名未标注");
  }

  /* 灯箱：当前条目所属地点的全部照片 */
  function groupList(s){
    var arr = curVis.filter(function(x){ return x.site === s.site; });
    if(!arr.length) arr = [s];
    var list = [];
    arr.forEach(function(x){ (x.photos || []).forEach(function(p){ list.push({s:x, p:p}); }); });
    return list;
  }

  function openLightbox(i){
    var s = curVis[i];
    if(!s) return;
    var list = groupList(s);
    if(!list.length){ return; }
    var idx = 0;
    list.forEach(function(it, k){ if(it.s === s) idx = k; });
    st.lb = { on:true, list:list, i:idx };
    $("lb").classList.add("on");
    paintLightbox();
  }

  function paintLightbox(){
    var it = st.lb.list[st.lb.i];
    if(!it) return;
    var s = it.s;
    $("lb-img").src = IMG + it.p;
    $("lb-img").alt = s.name;

    $("lb-kicker").textContent = s.site + " · " + (s.kind === "plant" ? "植物" : "迁地展养动物");
    $("lb-name").textContent = s.name;
    $("lb-latin").textContent = s.latin || "学名未定";

    var meta = [s.family || "科名未标注"];
    if(s.photos && s.photos.length > 1) meta.push("本条 " + s.photos.length + " 张照片");
    $("lb-meta").textContent = meta.join("　·　");

    $("lb-tags").innerHTML = (s.tags || []).map(function(t){
      return '<span class="lb-tag">' + t + '</span>';
    }).join("");

    $("lb-desc").textContent = (s.desc && s.desc.trim())
      ? s.desc.trim()
      : "原文未提供该物种的形态描述（鉴定未定）。";

    if(s.basis && s.basis.trim()){
      $("lb-basis-wrap").style.display = "";
      $("lb-basis").innerHTML = s.basis.trim()
        .split(/　+/)
        .map(function(seg){
          return seg.replace(/^([^：:]{1,8}[：:])/, '<b>$1</b>');
        })
        .join("<br>");
    } else {
      $("lb-basis-wrap").style.display = "none";
    }

    if(s.alias && s.alias.trim()){
      $("lb-alias-wrap").style.display = "";
      $("lb-alias").textContent = s.alias.trim();
    } else {
      $("lb-alias-wrap").style.display = "none";
    }

    $("lb-info").scrollTop = 0;

    var n = st.lb.list.length;
    $("lb-prev").classList.toggle("off", n <= 1);
    $("lb-next").classList.toggle("off", n <= 1);
    $("lb-idx").textContent = (st.lb.i + 1) + " / " + n + " 张";
    $("lb-pos").textContent = n > 1 ? "←  →  切换图片" : "";
  }

  function closeLightbox(){
    st.lb.on = false;
    $("lb").classList.remove("on");
    $("lb-img").src = "";
  }

  function stepLightbox(d){
    if(!st.lb.on) return;
    var n = st.lb.list.length;
    if(n <= 1) return;
    st.lb.i = (st.lb.i + d + n) % n;
    var img = $("lb-img");
    img.classList.add("swap");
    setTimeout(function(){
      paintLightbox();
      img.classList.remove("swap");
    }, 100);
  }

  /* 事件 */
  document.addEventListener("click", function(e){
    var chip = e.target.closest(".chip");
    if(chip){
      var k = chip.dataset.k, v = chip.dataset.v;
      st.f[k] = (st.f[k] === v) ? "" : v;
      st.sel = 0;
      renderWall();
      return;
    }
    var card = e.target.closest(".card");
    if(card){ st.sel = +card.dataset.i; paintSel(); openLightbox(st.sel); return; }
    if(e.target.id === "lb-close") { closeLightbox(); return; }
    var navBtn = e.target.closest(".lb-nav");
    if(navBtn){ stepLightbox(navBtn.id === "lb-prev" ? -1 : 1); return; }
    if(e.target.id === "lb") { closeLightbox(); return; }
  });

  $("q").addEventListener("input", function(){
    st.f.q = this.value.trim();
    st.sel = 0;
    renderWall();
  });

  document.addEventListener("keydown", function(e){
    if(st.lb.on){
      if(e.key === "Escape"){ closeLightbox(); e.preventDefault(); }
      else if(e.key === "ArrowLeft"){ stepLightbox(-1); e.preventDefault(); }
      else if(e.key === "ArrowRight"){ stepLightbox(1); e.preventDefault(); }
      return;
    }
    if(e.key === "/" && document.activeElement !== $("q")){
      $("q").focus(); e.preventDefault(); return;
    }
    if(e.key === "Escape"){
      st.f = {site:"", fam:"", tag:"", q:""}; $("q").value = ""; st.sel = 0; renderWall(); return;
    }
    if(e.key === "ArrowRight" || e.key === "ArrowDown"){
      st.sel = Math.min(curVis.length - 1, st.sel + 1); paintSel();
      var el = document.querySelector('#wgrid .card.sel');
      if(el) el.scrollIntoView({block:"nearest", behavior:"smooth"});
      e.preventDefault();
    }
    if(e.key === "ArrowLeft" || e.key === "ArrowUp"){
      st.sel = Math.max(0, st.sel - 1); paintSel();
      var el2 = document.querySelector('#wgrid .card.sel');
      if(el2) el2.scrollIntoView({block:"nearest", behavior:"smooth"});
      e.preventDefault();
    }
    if(e.key === "Enter"){ openLightbox(st.sel); e.preventDefault(); }
  });

  renderWall();

  // 支持 ?open=N 直接打开第 N 条（从 0 起算）
  var om = location.search.match(/[?&]open=(\d+)/);
  if(om && curVis[+om[1]]){
    st.sel = +om[1];
    paintSel();
    openLightbox(st.sel);
  }
})();
</script>
</body>
</html>
